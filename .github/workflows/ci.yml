name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stackhouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STACKHOUSE_TEST_URL: postgres://postgres:password@localhost:5432/stackhouse_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Non-blocking for now: this codebase has pre-existing clippy warnings
      # (mostly dead-code/style lints in the connector library) tracked as
      # cleanup debt rather than a merge gate. Tighten to `-D warnings` once
      # that backlog is cleared.
      - name: cargo clippy (report only)
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: cargo build
        run: cargo build --release

      - name: cargo test
        run: cargo test --release

  ui:
    name: UI (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      # Non-blocking for now: pre-existing lint debt (react-hooks strict
      # rules, a few unused vars) tracked as cleanup, not a merge gate.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
      - run: npm run build
