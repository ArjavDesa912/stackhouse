apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackhouse.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.stackhouse.autoscaling.enabled }}
  replicas: {{ .Values.stackhouse.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stackhouse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "stackhouse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/v1/stats"
    spec:
      serviceAccountName: {{ include "stackhouse.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.stackhouse.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.stackhouse.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "stackhouse.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: api
        {{- end }}
      {{- end }}
      containers:
        - name: stackhouse
          image: "{{ .Values.stackhouse.image.repository }}:{{ .Values.stackhouse.image.tag }}"
          imagePullPolicy: {{ .Values.stackhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.stackhouse.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.stackhouse.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: STACKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stackhouse.secrets.secretName }}
                  key: {{ .Values.stackhouse.secrets.keys.databaseUrl }}
            - name: STACKHOUSE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stackhouse.secrets.secretName }}
                  key: {{ .Values.stackhouse.secrets.keys.jwtSecret }}
            - name: STACKHOUSE_DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stackhouse.secrets.secretName }}
                  key: {{ .Values.stackhouse.secrets.keys.dataEncryptionKey }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stackhouse.secrets.secretName }}
                  key: {{ .Values.stackhouse.secrets.keys.redisUrl }}
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stackhouse.secrets.secretName }}
                  key: {{ .Values.stackhouse.secrets.keys.qdrantUrl }}
          resources:
            {{- toYaml .Values.stackhouse.resources | nindent 12 }}
          {{- if .Values.stackhouse.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.stackhouse.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.stackhouse.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.stackhouse.readinessProbe | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          {{- if .Values.stackhouse.securityContext }}
          securityContext:
            {{- toYaml .Values.stackhouse.securityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.stackhouse.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.stackhouse.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "stackhouse.fullname" . }}-data
      {{- end }}
